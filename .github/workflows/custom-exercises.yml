name: Install STRYDE custom exercises
on:
  push:
    branches: [main]
    paths: ['tools/apply-custom-exercises.py', '.github/workflows/custom-exercises.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stryde-custom-exercises
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply guarded browser-tested update
        run: python tools/apply-custom-exercises.py
      - name: Validate JavaScript and patch whitespace
        run: |
          node --check progress-model.js
          node --check training-hub.js
          git diff --check
      - name: Commit only the four application files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add progress-model.js training-hub.js custom-exercises.css index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add reusable Custom exercise logging and progress history; keep existing workout plans intact'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
