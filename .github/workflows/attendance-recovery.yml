name: Retire unused attendance installer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/attendance-recovery.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify live implementation and remove only untouched inactive files
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          page=Path('index.html').read_text()
          assert 'gym-attendance.js' in page
          assert 'trainingPlanOn' in Path('v2-core.js').read_text()
          expected={'attendance-model.js':'b7bd509977ede5cb0495932149c4622d429bc4ff8deb4d495703d0f2d4de8a70','attendance-ui.js':'c167916ae2d5622c6a3a30b5505ce6dc36a7f0622c71fd80fd127c02445e21fd','attendance.css':'98b123723abe174e636ea3db32a7f015aa521288abe861dcb1adbcad100fea01','tests/test_attendance_schedule.mjs':'1428a0efc120a158931d660aae1e3f9d179d40a3a5f3439b4aa4bbd4683d0fc4','tools/install-attendance-recovery.py':'d5427d08d5faaece5c7893b2a93b66345cab4a9b720ca128a62a482a64e2a3a0'}
          for path,digest in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          assert 'src="attendance-model.js' not in page and 'src="attendance-ui.js' not in page and 'href="attendance.css' not in page
          for path in expected: Path(path).unlink()
          PY
      - name: Validate canonical application
        run: |
          node --test tests/test_account_model.mjs tests/test_dynamic_schedule.mjs tests/test_attendance_availability.mjs
          for file in *.js; do node --check "$file"; done
      - name: Commit cleanup only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm attendance-model.js attendance-ui.js attendance.css tests/test_attendance_schedule.mjs tools/install-attendance-recovery.py .github/workflows/attendance-recovery.yml
          git commit -m 'Remove unused alternate attendance assets; retain verified live implementation'
          git pull --rebase origin main
          git push origin HEAD:main
