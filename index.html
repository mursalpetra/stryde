<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151d"><link rel="manifest" href="manifest.webmanifest"><title>STRYDE</title><style>body{margin:0;background:#10151d;color:#f3f6fc;font:16px system-ui,-apple-system,sans-serif;padding:20px 16px 100px}*{box-sizing:border-box}main{max-width:650px;margin:auto}h1{font-size:32px;margin:0}h2{font-size:20px}p,small{color:#aabaca}.card{background:#1c2935;border:1px solid #344352;border-radius:18px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#14212d;border-radius:12px;padding:14px}.stat b{font-size:23px;display:block}button{border:0;background:#304455;color:white;padding:11px;border-radius:11px;font:inherit;cursor:pointer}.primary{background:#79e5bd;color:#10251d;font-weight:700}input,select,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #526171;border-radius:10px;background:#10151d;color:white;font:inherit}label{display:block;color:#b4c4d0;font-size:13px;margin-top:10px}nav{position:fixed;bottom:0;left:0;right:0;background:#17222d;display:flex;padding:9px 6px max(9px,env(safe-area-inset-bottom));z-index:3}nav button{flex:1;background:none;font-size:12px;padding:12px 2px}nav .on{color:#79e5bd}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #344352}.tag{color:#79e5bd;font-size:12px;letter-spacing:2px;font-weight:700}a{color:#79e5bd}.muted{color:#aabaca;font-size:13px}.warn{padding:12px;background:#3d3225;border-radius:10px;color:#f2cfa1}.guide{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #344352}.guide img{width:88px;height:75px;object-fit:cover;border-radius:10px}.guide div{flex:1}</style></head><body><main id="root"></main><nav id="nav"></nav><script src="app.js"></script></body></html>
